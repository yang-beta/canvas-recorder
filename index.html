<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>洸限｜品牌故事 (1080p 背景錄影版)</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@300;400;600&family=Noto+Sans+TC:wght@300;400;500&display=swap');

:root {
  --surface-bg:#1a1a1a;
  --text-main:#E6E6E8;
}

*, *::before, *::after {
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html, body {
  width:100%;
  height:100%;
  overflow:hidden;
  background:var(--surface-bg);
  color:var(--text-main);
  font-family:"Noto Serif TC", "PMingLiU", serif;
}

#brandStorySection {
  position:relative;
  width:100vw;
  height:100vh;
  overflow:hidden;
  background:var(--surface-bg);
  display:flex;
  justify-content:center;
  align-items:center;
}

#brandStoryCanvas {
  width:100%;
  height:100%;
  object-fit:contain;
}
</style>
</head>
<body>

<section id="brandStorySection">
  <!-- 所有背景、文字、括號、人物、柔焦遮罩均硬性繪製於 1920x1080 Canvas -->
  <canvas id="brandStoryCanvas" width="1920" height="1080"></canvas>
</section>

<script>
(() => {
  "use strict";

  const canvas = document.getElementById("brandStoryCanvas");
  const ctx = canvas.getContext("2d");

  // 硬性鎖定極致畫質尺寸 1920x1080
  const W = 1920;
  const H = 1080;
  canvas.width = W;
  canvas.height = H;

  // 載入人物圖片
  const personImg = new Image();
  personImg.src = "./img/man-s.png";

  // 動畫即時狀態變數
  let state = {
    personAlpha: 0,
    line1Y: 50, line1Alpha: 0,
    line2Y: 50, line2Alpha: 0,
    bracketScale: 0.45, bracketAlpha: 0,
    focusBlurAlpha: 0,
    promoDateY: 50, promoDateAlpha: 0,
    promoTitleY: 50, promoTitleAlpha: 0
  };

  /* ============================================================
     1. 背景 Canvas 繪製 (3D 地平線與掃描光束)
     ============================================================ */
  let staticCoralRows = [];
  function generateStaticCoralRows(lineCount = 58) {
    const targetCount = 4 + Math.floor(Math.random() * 4);
    const rows = new Set();
    while (rows.size < targetCount) {
      rows.add(4 + Math.floor(Math.random() * Math.max(1, lineCount - 10)));
    }
    staticCoralRows = [...rows].sort((a,b) => a-b);
  }
  generateStaticCoralRows(58);

  function drawBackground(time) {
    ctx.fillStyle = "#1a1a1a";
    ctx.fillRect(0, 0, W, H);

    // 中心光暈
    const glowX = W * .255;
    const glowY = H * .245;
    const glowR = Math.max(W,H) * .31;
    const glow = ctx.createRadialGradient(glowX, glowY, 0, glowX, glowY, glowR);
    glow.addColorStop(0, "rgba(255,176,136,.055)");
    glow.addColorStop(.35, "rgba(111,140,128,.030)");
    glow.addColorStop(1, "rgba(0,0,0,0)");
    ctx.fillStyle = glow;
    ctx.fillRect(0, 0, W, H);

    // 網格地平線
    const horizonY = H * (5 / 7);
    const floorHeight = H - horizonY;
    const lineCount = 58;
    const sweepProgress = ((time * .000055) % 1 + 1) % 1;
    const sweepLine = sweepProgress * (lineCount - 1);
    const crossRange = .10;
    const endFade = 1 - Math.max(0, Math.min(1, (sweepProgress - (1 - crossRange)) / crossRange));
    const nextFade = Math.max(0, Math.min(1, (sweepProgress - (1 - crossRange)) / crossRange));

    for (let row = 0; row < lineCount; row++) {
      const t = row / (lineCount - 1);
      const baseY = horizonY + Math.pow(t, 1.36) * (floorHeight + 10);
      const alphaProgress = Math.max(0, Math.min(1, (baseY - horizonY) / Math.max(1, H * .775 - horizonY)));
      const baseAlpha = .05 + .45 * alphaProgress;
      const thicknessPattern = [.56,.84,.64,1.10,.70,.94][row % 6];
      const baseWidth = thicknessPattern + t * .14;

      ctx.save();
      ctx.beginPath();
      ctx.moveTo(0, baseY);
      ctx.lineTo(W, baseY);
      ctx.strokeStyle = `rgba(230,230,232,${baseAlpha})`;
      ctx.lineWidth = baseWidth;
      ctx.stroke();
      ctx.restore();

      if (staticCoralRows.includes(row)) {
        ctx.save();
        ctx.beginPath();
        ctx.moveTo(0, baseY);
        ctx.lineTo(W, baseY);
        ctx.strokeStyle = `rgba(255,176,136,${Math.min(.34, baseAlpha * .72)})`;
        ctx.lineWidth = Math.max(baseWidth, .82);
        ctx.stroke();
        ctx.restore();
      }

      const currentDistance = Math.abs(row - sweepLine);
      const currentGlow = Math.max(0, 1 - currentDistance / 2.35) * endFade;
      const nextDistance = Math.abs(row);
      const nextGlow = Math.max(0, 1 - nextDistance / 2.35) * nextFade;
      const lineGlow = Math.max(currentGlow, nextGlow);

      if (lineGlow > 0) {
        ctx.save();
        ctx.beginPath();
        ctx.moveTo(0, baseY);
        ctx.lineTo(W, baseY);
        ctx.strokeStyle = `rgba(255,176,136,${.10 + lineGlow * .30})`;
        ctx.lineWidth = Math.max(baseWidth, .88 + lineGlow * .25);
        ctx.stroke();
        ctx.restore();
      }
    }
  }

  /* ============================================================
     2. 全場景繪製 (DOM 轉 Canvas 像素)
     ============================================================ */
  function drawScene(time) {
    drawBackground(time);

    // 人物與陰影
    if (state.personAlpha > 0) {
      ctx.save();
      ctx.globalAlpha = state.personAlpha * 0.92;
      const pw = 45, ph = 135;
      const px = W * 0.585, py = H * 0.775 - ph + 10;

      // 繪製人影倒影
      ctx.save();
      ctx.fillStyle = "rgba(25,17,14,0.5)";
      ctx.beginPath();
      ctx.ellipse(px + pw/2, py + ph, pw * 1.5, 8, Math.PI / 4, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();

      if (personImg.complete && personImg.naturalWidth > 0) {
        ctx.drawImage(personImg, px, py, pw, ph);
      }
      ctx.restore();
    }

    ctx.save();
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";

    // 第一句文字: 因為有限 所以珍惜
    if (state.line1Alpha > 0) {
      ctx.font = "400 38px 'Noto Serif TC', 'PMingLiU', serif";
      ctx.fillStyle = `rgba(244,244,244,${state.line1Alpha * 0.94})`;
      ctx.letterSpacing = "0.6rem";
      ctx.fillText("因為有限 所以珍惜", W / 2, H * 0.47 - 30 + state.line1Y);
    }

    // 第二句文字: 因為記得 所以重逢
    if (state.line2Alpha > 0) {
      ctx.font = "400 38px 'Noto Serif TC', 'PMingLiU', serif";
      ctx.fillStyle = `rgba(244,244,244,${state.line2Alpha * 0.94})`;
      ctx.letterSpacing = "0.6rem";
      ctx.fillText("因為記得 所以重逢", W / 2, H * 0.47 + 30 + state.line2Y);
    }

    // ［ ］ 括號
    if (state.bracketAlpha > 0) {
      ctx.strokeStyle = `rgba(230,230,232,${state.bracketAlpha * 0.64})`;
      ctx.lineWidth = 1.5;
      const bw = 28, bh = 130 * state.bracketScale;
      const cy = H * 0.47;

      // 左括號
      const lx = W / 2 - 245;
      ctx.beginPath();
      ctx.moveTo(lx + bw, cy - bh/2);
      ctx.lineTo(lx, cy - bh/2);
      ctx.lineTo(lx, cy + bh/2);
      ctx.lineTo(lx + bw, cy + bh/2);
      ctx.stroke();

      // 右括號
      const rx = W / 2 + 245;
      ctx.beginPath();
      ctx.moveTo(rx - bw, cy - bh/2);
      ctx.lineTo(rx, cy - bh/2);
      ctx.lineTo(rx, cy + bh/2);
      ctx.lineTo(rx - bw, cy + bh/2);
      ctx.stroke();
    }

    // 品牌色文字 1: 9月1日
    if (state.promoDateAlpha > 0) {
      ctx.font = "400 42px 'Noto Serif TC', 'PMingLiU', serif";
      ctx.fillStyle = `rgba(255,107,107,${state.promoDateAlpha})`;
      ctx.fillText("9月1日", W / 2, H * 0.47 + state.promoDateY);
    }

    // 品牌色文字 2: 拾洸記憶展
    if (state.promoTitleAlpha > 0) {
      ctx.font = "400 42px 'Noto Serif TC', 'PMingLiU', serif";
      ctx.fillStyle = `rgba(255,107,107,${state.promoTitleAlpha})`;
      ctx.fillText("拾洸記憶展", W / 2, H * 0.47 + state.promoTitleY);
    }
    ctx.restore();

    // 聚焦遮罩模擬 (Focus Blur)
    if (state.focusBlurAlpha > 0) {
      ctx.save();
      ctx.fillStyle = `rgba(18,18,18, ${state.focusBlurAlpha * 0.45})`;
      
      // 中間保留 ［ ］ 清晰區塊
      const focusW = 520, focusH = 180;
      const fx = W/2 - focusW/2, fy = H*0.47 - focusH/2;
      
      ctx.beginPath();
      ctx.rect(0, 0, W, H);
      ctx.rect(fx, fy, focusW, focusH);
      ctx.fill("evenodd");
      ctx.restore();
    }
  }

  /* ============================================================
     3. 緩動動畫引擎 (Ease Out Cubic)
     ============================================================ */
  function animate(target, props, duration) {
    return new Promise(resolve => {
      const start = performance.now();
      const initial = {};
      for (let k in props) initial[k] = target[k];

      function step(now) {
        const progress = Math.min((now - start) / duration, 1);
        const ease = 1 - Math.pow(1 - progress, 3);
        for (let k in props) {
          target[k] = initial[k] + (props[k] - initial[k]) * ease;
        }
        if (progress < 1) requestAnimationFrame(step);
        else resolve();
      }
      requestAnimationFrame(step);
    });
  }

  const sleep = ms => new Promise(r => setTimeout(r, ms));

  /* ============================================================
     4. 完整腳本時間軸 (Timeline)
     ============================================================ */
  async function runTimeline() {
    // 人物登場
    animate(state, { personAlpha: 1 }, 1200);
    await sleep(2500);

    // 第一句文字緩緩浮現 (1.6秒)
    animate(state, { line1Y: 0, line1Alpha: 1 }, 1600);
    await sleep(1500);

    // 第二句文字緩緩浮現 (1.6秒)
    animate(state, { line2Y: 0, line2Alpha: 1 }, 1600);
    await sleep(1000);

    // ［ ］ 括號出現
    animate(state, { bracketScale: 1, bracketAlpha: 1 }, 620);
    await sleep(500);

    // 聚焦：慢慢模糊 2 秒 -> 停留 2 秒 -> 恢復 2 秒
    await animate(state, { focusBlurAlpha: 1 }, 2000);
    await sleep(2000);
    await animate(state, { focusBlurAlpha: 0 }, 2000);

    // 清除 ［ ］ 與文字
    animate(state, { line1Alpha: 0, line2Alpha: 0, bracketAlpha: 0 }, 600);
    await sleep(600);

    // 出現品牌色「9月1日」 -> 1.5 秒後淡出
    animate(state, { promoDateY: 0, promoDateAlpha: 1 }, 1500);
    await sleep(1500 + 1500);
    animate(state, { promoDateY: -20, promoDateAlpha: 0 }, 600);
    await sleep(600);

    // 同位置出現品牌色「拾洸記憶展」並停留
    animate(state, { promoTitleY: 0, promoTitleAlpha: 1 }, 1500);
  }

  /* ============================================================
     5. 啟動繪製與背景 1080p 自動錄影下載
     ============================================================ */
  function render(time) {
    drawScene(time);
    requestAnimationFrame(render);
  }
  requestAnimationFrame(render);

  function startRecordingAndPlay() {
    const stream = canvas.captureStream(60);
    const recorder = new MediaRecorder(stream, {
      mimeType: 'video/webm;codecs=vp9',
      videoBitsPerSecond: 12000000 // 12 Mbps 比特率
    });

    const chunks = [];
    recorder.ondataavailable = e => chunks.push(e.data);
    recorder.onstop = () => {
      const blob = new Blob(chunks, { type: 'video/webm' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = '洸限_品牌故事_1080p.webm';
      a.click();
      URL.revokeObjectURL(url);
    };

    recorder.start();
    runTimeline();

    // 全動畫流程約 18.5 秒，時間到自動停止錄影並匯出檔案
    setTimeout(() => {
      recorder.stop();
    }, 19000);
  }

  // 確保圖片載入後立即開始播放並側錄
  if (personImg.complete) {
    startRecordingAndPlay();
  } else {
    personImg.onload = startRecordingAndPlay;
    personImg.onerror = startRecordingAndPlay; // 防呆機制
  }
})();
</script>

</body>
</html>
